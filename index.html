<title>Kenneth Dajao</title>
<style>
:root{--bg:#000;--card:transparent;--ink:#fff;--muted:#aaa;--brand:#fff;--brand-ink:#000;--line:#fff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Roboto","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:transparent;border:none;border-radius:28px;padding:36px 24px 28px;text-align:center}
.photo{width:136px;height:136px;border-radius:50%;object-fit:cover;border:4px solid var(--brand);display:block;margin:0 auto 18px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}
.role{margin:0 0 26px;color:var(--muted);font-size:1.02rem}
.btn{font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 16px;margin-top:12px;border-radius:14px;font:inherit;font-size:1.05rem;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid var(--brand)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.primary{background:var(--brand);color:var(--brand-ink)}
.ghost{background:transparent;color:var(--ink)}
.btn svg{width:22px;height:22px;flex:none}
.small{margin:18px 0 0;font-size:.92rem;color:var(--muted)}
.small a{color:var(--muted)}
</style>
