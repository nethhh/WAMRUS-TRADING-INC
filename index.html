<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAMRUS Trading Incorporated | Digital Business Card</title>
<meta name="description" content="Wamrus Trading Inc. designs and sources corporate gifts, licensed and generic items. Tap to call, email, visit or save our contact.">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" href="https://wamrus.com/wp-content/uploads/2025/09/cropped-TCS-Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  /* ---- EDIT BRAND COLORS HERE ---- */
  --ink:#0e0e0e; --paper:#f6f6f4; --card:#ffffff; --line:#e3e3df; --muted:#5d5d58; --accent:#0e0e0e;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}

/* Hero */
.hero{background:var(--ink);color:#fff;margin:0 -16px;padding:36px 24px 72px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 40px rgba(255,255,255,.03)}
.logo{display:inline-flex;background:#fff;border-radius:16px;padding:12px 18px;position:relative;z-index:1;animation:rise .7s ease both}
.logo img{height:44px;width:auto;display:block}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10.5vw,46px);line-height:1.02;letter-spacing:-.02em;margin:28px 0 12px;position:relative;z-index:1}
.hero p{color:#c9c9c4;font-size:15px;max-width:34ch;position:relative;z-index:1}
.name{margin-top:22px;font-size:13px;color:#9a9a94;position:relative;z-index:1}

/* Primary actions overlap hero */
.actions{margin-top:-44px;position:relative;z-index:2}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;font-weight:600;font-size:16px;border:1px solid transparent;cursor:pointer;font-family:inherit;width:100%;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex:none}
.primary{background:#fff;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.primary:hover{box-shadow:0 14px 34px rgba(0,0,0,.26)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:96px;padding:14px;flex-direction:column;gap:8px;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tile:hover{border-color:var(--ink)}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:12px;text-align:center;word-break:break-all}
.save{background:var(--ink);color:#fff;margin-top:12px}
.save:hover{background:#2a2a2a}

/* Sections */
section{margin-top:32px}
h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel p{color:var(--muted);font-size:15px}
.stats{display:flex;gap:8px;margin-top:16px}
.stats div{flex:1;border-top:2px solid var(--ink);padding-top:8px}
.stats b{font-family:var(--display);font-size:24px;display:block;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:52px;padding:0 16px;font-weight:500;transition:border-color .15s,padding .15s}
.row:hover{border-color:var(--ink);padding-left:20px}
.row svg{width:18px;height:18px;color:var(--muted)}
.services{display:grid;gap:14px}
.services b{display:block;font-size:15px}
.services span{font-size:14px;color:var(--muted)}
.addr{font-style:normal;color:var(--muted);font-size:15px;margin-bottom:14px}
.social{display:flex;gap:12px}
.social a{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:500;font-size:14px}
.social a:hover{border-color:var(--ink)}
.social svg{width:20px;height:20px}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
footer img{height:28px;margin:0 auto 8px;display:block;opacity:.85}
[hidden]{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">

<header class="hero">
  <a class="logo" href="#" id="logoLink" aria-label="WAMRUS Trading Incorporated"><img id="logo" alt="WAMRUS logo" width="160" height="44"></a>
  <h1 id="tagline"></h1>
  <p id="intro"></p>
  <div class="name" id="company"></div>
</header>

<div class="actions">
  <a class="btn primary" id="web" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>Visit Our Website</a>

  <div class="grid" id="quick"></div>
  <button class="btn save" id="saveBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Save Contact</button>
</div>

<section aria-labelledby="h-links"><h2 id="h-links">Quick Links</h2><div class="list" id="links"></div></section>

<section aria-labelledby="h-about"><h2 id="h-about">About Wamrus</h2>
  <div class="panel"><p id="about"></p><div class="stats" id="stats"></div></div>
</section>

<section aria-labelledby="h-serv"><h2 id="h-serv">What We Do</h2>
  <div class="panel"><div class="services" id="services"></div></div>
</section>

<section aria-labelledby="h-loc"><h2 id="h-loc">Visit Us</h2>
  <div class="panel"><address class="addr" id="address"></address>
  <a class="btn primary" id="map" target="_blank" rel="noopener" style="border-color:var(--line);box-shadow:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Open in Google Maps</a></div>
</section>

<section aria-labelledby="h-soc" id="socialSec"><h2 id="h-soc">Follow Us</h2><div class="social" id="social"></div></section>

<footer><img id="flogo" alt=""><div id="copy"></div></footer>
</main>

<script>
/* =========================================================
   EDIT EVERYTHING HERE. The page builds itself from this.
   Leave a social "url" empty ("") to hide that button.
   ========================================================= */
const CONFIG = {
  company: "WAMRUS TRADING INCORPORATED",
  shortName: "Wamrus Trading Inc.",
  tagline: "Design. Conceptualize. Source.",
  intro: "Corporate gifts, licensed and generic items for major corporations and retailers. Importing, wholesaling and retailing since 1994.",
  logo: "https://wamrus.com/wp-content/uploads/2026/02/wmr.png",
  website: "https://wamrus.com/",
  phones: ["+6328501599", "+6328503045"],
  phoneLabels: ["+632 850 1599", "+632 850 3045"],
  emails: ["emma.jumawan@wamrus.com", "cecile.rubio@wamrus.com"],
  address: "12 Lotus Street, T.S. Cruz, Almanza II, Las Pinas City, Philippines",
  about: "Also known as The Catalog Shopper, Wamrus provides high quality and customized products to major corporations and retail outfits nationwide. The core of the business is design and product development, from factory sourcing to end-to-end logistics.",
  stats: [["30+", "Years in the market"], ["20M+", "Items produced"], ["6K", "Clients worldwide"]],
  services: [
    ["Merchandising Planning", "Line-ups planned around your budget, trends, pricing and timeline."],
    ["Product Design & Development", "From concept and specifications to quality checks and packaging."],
    ["Manufacturing", "Pre-production samples approved by you before mass production."],
    ["Logistics", "End-to-end supply chain, delivered from factory to your warehouse."]
  ],
  links: [
    ["Corporate Items", "https://wamrus.com/corporate/"],
    ["Licensed Items", "https://wamrus.com/licensed-items/"],
    ["Generic Items", "https://wamrus.com/generic-items/"],
    ["Locations", "https://wamrus.com/locations/"],
    ["Certifications", "https://wamrus.com/certifications/"],
    ["Our Clients", "https://wamrus.com/our-clients/"],
    ["Careers", "https://wamrus.com/careers/"],
    ["Contact Us", "https://wamrus.com/contact/"]
  ],
  /* The website shows Facebook, Twitter and Instagram icons but the page
     text did not include their addresses. Paste the real URLs here. */
  social: [
    ["Facebook", ""],
    ["Twitter", ""],
    ["Instagram", ""]
  ]
};

const $ = id => document.getElementById(id);
const I = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>'
};
const C = CONFIG;

document.title = C.shortName + " | Digital Business Card";
$("logo").src = C.logo; $("flogo").src = C.logo;
$("logoLink").href = C.website;
$("tagline").textContent = C.tagline; $("intro").textContent = C.intro;
$("company").textContent = C.company;
$("web").href = C.website; $("web").target = "_blank";
$("about").textContent = C.about;
$("address").textContent = C.address;
$("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(C.company + ", " + C.address);
$("copy").textContent = "\u00A9 " + new Date().getFullYear() + " " + C.company;

/* Quick contact tiles */
const tiles = [];
C.phones.forEach((p, i) => tiles.push([`tel:${p}`, I.phone, "Call", C.phoneLabels[i] || p]));
C.emails.forEach(e => tiles.push([`mailto:${e}`, I.mail, "Email", e.split("@")[0]]));
$("quick").innerHTML = tiles.map(t => `<a class="btn tile" href="${t[0]}">${t[1]}<span>${t[2]}</span><small>${t[3]}</small></a>`).join("");

$("links").innerHTML = C.links.map(l => `<a class="row" href="${l[1]}" target="_blank" rel="noopener">${l[0]}${I.arrow}</a>`).join("");
$("stats").innerHTML = C.stats.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
$("services").innerHTML = C.services.map(s => `<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");

const soc = C.social.filter(s => s[1]);
if (soc.length) $("social").innerHTML = soc.map(s => `<a href="${s[1]}" target="_blank" rel="noopener">${I.link}${s[0]}</a>`).join("");
else $("socialSec").hidden = true;

/* Save contact: builds a .vcf with every phone and email above */
$("saveBtn").addEventListener("click", () => {
  const esc = s => s.replace(/([,;])/g, "\\$1");
  const lines = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + esc(C.company), "ORG:" + esc(C.company)];
  C.phones.forEach(p => lines.push("TEL;TYPE=WORK,VOICE:" + p));
  C.emails.forEach(e => lines.push("EMAIL;TYPE=WORK:" + e));
  lines.push("ADR;TYPE=WORK:;;" + esc(C.address) + ";;;;", "URL:" + C.website, "END:VCARD");
  const blob = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "wamrus.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
